name: Docker image build and publish - private ECR repo
on:
#   workflow_dispatch:
  workflow_call:
    inputs:
      path_to_dockerfile:
        description: Path to the dockerfile (default = 'Dockerfile')
        default: "Dockerfile"
        type: string
      docker_build_dir:
        description: Docker build directory (default = '.')
        default: "."
        type: string
      image_tag:
        description: Tag to apply to images.
        type: string
        default: ${{ github.sha }}
      aws_account_id:
        description: AWS Account ID
        default: "210287912431"
        type: string
      ecr_repo_name:
        description: ECR repository name (default = lowercase of the GitHub repository name with / replaced by _ )
        required: false
        type: string

concurrency: ci-${{ github.repository }}-docker-pipeline
        
jobs:
  build-and-push:
    runs-on: arc-runner-set

    permissions:
      id-token: write
      contents: read

    outputs:
      image_tag: ${{ steps.build-publish.outputs.image_tag }}
      full_image: ${{ steps.build-publish.outputs.full_image }}

    steps:
    #   - uses: actions/checkout@v3
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ inputs.image_tag }}
          show-progress: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: eu-west-1
          role-to-assume: arn:aws:iam::${{ inputs.aws_account_id }}:role/KenWebIdentityECR
          role-duration-seconds: 900

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # - name: Login to Amazon ECR
      #   id: login-ecr
      #   env:
      #     AWS_ACCOUNT_ID: ${{ inputs.aws_account_id }}
      #     AWS_DEFAULT_REGION: eu-west-1
      #   shell: bash
      #   run: aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"

      - name: Build, tag, and push image to Amazon ECR
        id: build-publish
        shell: bash
        env:
          ECR_REPOSITORY: "${{ inputs.ecr_repo_name || github.event.repository.name }}"
          IMAGE_TAG: "arc-${{ inputs.image_tag }}"
          IMAGE_REPO_NAME_BASE: "${{ inputs.aws_account_id }}.dkr.ecr.eu-west-1.amazonaws.com/ken"
        run: |
          docker build --network=host "${{ inputs.docker_build_dir }}" -f "${{ inputs.path_to_dockerfile }}" -t "$IMAGE_REPO_NAME_BASE/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$IMAGE_REPO_NAME_BASE/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "IMAGE $IMAGE_TAG is pushed to $IMAGE_REPO_NAME_BASE/$ECR_REPOSITORY"
          echo "image_tag=$IMAGE_TAG" 
          echo "full_image=$IMAGE_REPO_NAME_BASE/$ECR_REPOSITORY:$IMAGE_TAG"