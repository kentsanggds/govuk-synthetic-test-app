name: Deploy

run-name: Use ARC to deploy ${{ inputs.gitRef || github.event.release.tag_name  }} to ${{ inputs.environment || 'integration' }}

on:
  push:
    branches:
      - test-arc
  workflow_dispatch:
    inputs:
      gitRef:
        description: 'Commit, tag or branch name to deploy'
        required: true
        type: string
        default: 'main'
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
        - integration
        - staging
        default: 'integration'
  release:
    types: [released]

jobs:
  build-and-publish-image:
    # if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    name: Build and publish image
    uses: ./.github/workflows/build-and-push-image-arc.yml
    with:
      image_tag: ${{ inputs.gitRef || github.sha }}
      ecr_repo_name: "govuk-synthetic-test-app"
    permissions:
      id-token: write
      contents: read
      packages: write
